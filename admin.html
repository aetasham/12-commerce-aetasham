<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetasham Wallah | Student Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f6fb;color:#172033}.top{background:linear-gradient(135deg,#3157d5,#673ab7);color:#fff;padding:28px 20px}.wrap{max-width:1050px;margin:auto;padding:22px}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 5px 18px #0001;margin-bottom:18px}input,button{padding:12px;border-radius:10px;font-size:15px}input{border:1px solid #ccd1df;width:100%;margin:6px 0}button{border:0;background:#3157d5;color:#fff;font-weight:bold;cursor:pointer;margin:6px 4px 6px 0}.danger{background:#c62828}.hidden{display:none}.code{font-weight:bold;letter-spacing:2px}.msg{margin-top:10px;padding:10px;border-radius:10px;background:#f1efff}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding:14px 0;flex-wrap:wrap}.muted{color:#69758a;font-size:14px}</style></head><body><header class="top"><div class="wrap"><h1>⚙️ Student Access Admin</h1><p>Generate and revoke free study passwords.</p><a href="index.html" style="color:#fff">🌐 View Website</a></div></header><main class="wrap"><section id="login" class="card"><h2>🔐 Admin Login</h2><input id="adminPass" type="password" placeholder="Admin password" autocomplete="current-password"><button onclick="adminLogin()">Login</button><div id="loginMsg"></div></section><section id="panel" class="hidden"><div class="card"><h2>➕ Generate Student Password</h2><input id="studentName" maxlength="50" placeholder="Student name"><button onclick="createStudent()">Generate Password</button><div id="createMsg"></div></div><div class="card"><h2>👥 Student Passwords</h2><button onclick="loadStudents()">Refresh List</button><div id="students"><p class="muted">Login and load the list.</p></div></div></section></main><script>let adminPassword='';const API='https://12-commerce-aetasham.vercel.app/api/student-access';async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Password':adminPassword},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}async function adminLogin(){adminPassword=document.getElementById('adminPass').value;if(!adminPassword)return;try{await call({action:'list'});document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');loadStudents()}catch(e){document.getElementById('loginMsg').textContent=e.message;adminPassword=''}}async function createStudent(){const name=document.getElementById('studentName').value.trim();if(!name)return alert('Enter student name.');try{const d=await call({action:'create',name});document.getElementById('createMsg').innerHTML='Created: <b class="code">'+d.code+'</b> — give this password to the student.';document.getElementById('studentName').value='';loadStudents()}catch(e){document.getElementById('createMsg').textContent=e.message}}async function loadStudents(){try{const d=await call({action:'list'});const box=document.getElementById('students');if(!d.students.length){box.innerHTML='<p class="muted">No students yet.</p>';return}box.innerHTML=d.students.map(s=>'<div class="row"><div><b>'+escapeHtml(s.name)+'</b><br><span class="code">'+s.code+'</span> · '+(s.revoked?'❌ Revoked':'✅ Active')+'</div>'+(s.revoked?'':'<button class="danger" onclick="revoke(\''+s.code+'\')">Revoke</button>')+'</div>').join('')}catch(e){document.getElementById('students').textContent=e.message}}async function revoke(code){if(!confirm('Revoke '+code+'? The student will no longer be able to log in.'))return;try{await call({action:'revoke',code});loadStudents()}catch(e){alert(e.message)}}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
