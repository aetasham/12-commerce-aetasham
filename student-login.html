<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetasham Wallah | Student Login</title><style>body{font-family:Arial;background:#f4f6fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#172033}.box{width:min(430px,90%);background:#fff;padding:30px;border-radius:20px;box-shadow:0 8px 30px #0002;text-align:center}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px;font-size:16px}input{border:1px solid #ccd1df}button{border:0;background:#673ab7;color:#fff;font-weight:bold;cursor:pointer}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#f1efff}.small{color:#667085;line-height:1.5;font-size:14px}</style></head><body><main class="box"><h1>📚 Aetasham Student Login</h1><p>Enter the free study password given by the admin.</p><input id="code" maxlength="11" placeholder="AW-XXXXXXXX" autocomplete="off"><button onclick="login()">🔐 Login & Study</button><div id="msg"></div><hr><p class="small">Your password is checked by the secure Vercel backend. Never share it publicly.</p></main><script>async function login(){const code=document.getElementById('code').value.trim().toUpperCase();const msg=document.getElementById('msg');if(!/^AW-[A-F0-9]{8}$/.test(code)){msg.textContent='Enter a valid study password.';return}msg.textContent='Checking...';try{const r=await fetch('https://12-commerce-aetasham.vercel.app/api/student-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',code})});const d=await r.json();if(!r.ok||!d.valid)throw new Error('Invalid or revoked password.');sessionStorage.setItem('aetashamStudentName',d.name);sessionStorage.setItem('aetashamStudyPass',code);location.href='index.html'}catch(e){msg.textContent=e.message||'Login failed. Please try again.'}}</script></body></html>
