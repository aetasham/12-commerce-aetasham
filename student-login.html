<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aetasham Wallah | Free Student Login</title><style>body{font-family:Arial,sans-serif;background:#f4f6fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#172033}.box{width:min(420px,90%);background:#fff;padding:30px;border-radius:20px;box-shadow:0 8px 30px #0002;text-align:center}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:10px;font-size:16px}input{border:1px solid #ccd1df}button{border:0;background:#673ab7;color:#fff;font-weight:bold;cursor:pointer}.code{font-size:24px;font-weight:bold;letter-spacing:2px;background:#f1efff;padding:15px;border-radius:10px;margin:15px 0}.hidden{display:none}.small{color:#667085;line-height:1.5;font-size:14px}</style></head><body><main class="box"><h1>📚 Free Student Study Pass</h1><p>Enter your name to get a free study pass for this browser.</p><input id="name" maxlength="50" placeholder="Student name"><button onclick="createPass()">Get Free Password</button><section id="result" class="hidden"><p>Your free password is:</p><div class="code" id="code"></div><button onclick="enterStudy()">Continue to Study</button></section><hr><p class="small">This is a basic browser-based free pass. It is not a secure account system yet; a real student account system needs a database and server-side authentication.</p></main><script>function createPass(){const n=document.getElementById('name').value.trim();if(!n)return alert('Please enter your name.');const code='AW-'+Math.random().toString(36).slice(2,8).toUpperCase();localStorage.setItem('aetashamStudentName',n);localStorage.setItem('aetashamStudyPass',code);document.getElementById('code').textContent=code;document.getElementById('result').classList.remove('hidden')}function enterStudy(){if(localStorage.getItem('aetashamStudyPass'))location.href='index.html'}window.addEventListener('load',()=>{const c=localStorage.getItem('aetashamStudyPass');if(c){document.getElementById('code').textContent=c;document.getElementById('result').classList.remove('hidden')}})</script></body></html>
